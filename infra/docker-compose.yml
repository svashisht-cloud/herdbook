name: fleet

# Step 0: infrastructure. Step 1: four simulated robots. Ingest and dashboard come in later steps.
# Run from this folder:  cp .env.example .env && docker compose up -d
# Ports bind to 127.0.0.1 so nothing is reachable from your LAN.

# Shared robot template. YAML merge keys are shallow, so each robot's `environment`
# must merge *robot-env itself, or it would replace the template's whole map.
x-robot: &robot
  build: ../robot
  image: fleet-robot
  environment: &robot-env
    # ROS topics never leave a robot: DDS discovery stays inside the container.
    ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
    # Broker connection for edge_agent. Credentials come from .env, as for mosquitto.
    MQTT_HOST: mosquitto
    MQTT_PORT: "1883"
    MQTT_USER: ${MQTT_USER}
    MQTT_PASSWORD: ${MQTT_PASSWORD}
  # Lists don't merge either: each robot lists *robot-src next to its own /data volume.
  volumes:
    - &robot-src ../robot:/ws/src/herdbook_robot:ro
  # Read-only source; colcon builds into the container's own /ws (build/, install/, log/),
  # never into the mounted folder. `restart robotN` rebuilds and runs the current code.
  # The .bashrc line gives `docker compose exec robotN bash` the same environment.
  command:
    - bash
    - -c
    - |
      set -e
      cd /ws
      colcon build --symlink-install
      grep -qxF 'source /ws/install/setup.bash' /root/.bashrc || echo 'source /ws/install/setup.bash' >> /root/.bashrc
      source /ws/install/setup.bash
      exec ros2 launch herdbook_robot robot.launch.py robot_id:="$$ROBOT_ID"

services:
  robot1:
    <<: *robot
    environment:
      <<: *robot-env
      ROBOT_ID: robot1
    volumes:
      - *robot-src
      - robot1-data:/data

  robot2:
    <<: *robot
    environment:
      <<: *robot-env
      ROBOT_ID: robot2
    volumes:
      - *robot-src
      - robot2-data:/data

  robot3:
    <<: *robot
    environment:
      <<: *robot-env
      ROBOT_ID: robot3
    volumes:
      - *robot-src
      - robot3-data:/data

  robot4:
    <<: *robot
    environment:
      <<: *robot-env
      ROBOT_ID: robot4
    volumes:
      - *robot-src
      - robot4-data:/data

  mosquitto:
    image: eclipse-mosquitto:2
    # Build the password file from .env at startup, so no credential is ever committed.
    # Delete it first: mosquitto_passwd -c refuses to overwrite an existing file, and the
    # file lives on the data volume, so without this every restart after the first fails.
    entrypoint: >
      sh -c 'rm -f /mosquitto/data/passwd &&
             mosquitto_passwd -c -b /mosquitto/data/passwd "$$MQTT_USER" "$$MQTT_PASSWORD" &&
             chown mosquitto:mosquitto /mosquitto/data/passwd &&
             chmod 0700 /mosquitto/data/passwd &&
             exec mosquitto -c /mosquitto/config/mosquitto.conf'
    environment:
      MQTT_USER: ${MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  timescaledb:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Init scripts run ONLY when the data volume is empty.
      # After editing init.sql: docker compose down -v && docker compose up -d
      - ./init.sql:/docker-entrypoint-initdb.d/010_init.sql:ro
      - pgdata:/var/lib/postgresql/data

  minio:
    # MinIO Inc. archived the community edition and pulled its public images
    # (Docker Hub deleted, Quay requires login since Sept 2026). pgsty/minio ("Silo")
    # is a community-maintained build of the same server: same S3 API, MINIO_* env vars
    # and console. The code only talks S3, so swapping servers is an endpoint change.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - minio-data:/data

  # One-shot job: wait for MinIO, create the bucket, exit 0.
  # Reuses the server image because it bundles the client (as mcli, with an mc alias).
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      - minio
    entrypoint: >
      sh -c 'MC=$$(command -v mc || command -v mcli) &&
             until $$MC alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1;
             do echo "waiting for minio..."; sleep 1; done &&
             $$MC mb --ignore-existing "local/$$MINIO_BUCKET"'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    restart: "no"

volumes:
  mosquitto-data:
  pgdata:
  minio-data:
  # Per-robot SQLite queue (Step 6). Unused until then.
  robot1-data:
  robot2-data:
  robot3-data:
  robot4-data: