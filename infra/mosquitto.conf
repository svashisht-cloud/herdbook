# Mosquitto 2.x listens on localhost only and rejects anonymous clients by default.
# Open the port to the compose network and require the password built from .env.
listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd

# Persist retained messages (robot online/offline status) and queued QoS 1
# messages for persistent sessions across broker restarts.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
